name: バグ報告
description: 不具合・表示崩れ・エラーを報告する
title: "[Bug] "
labels: ["bug"]
assignees:
  - bizyutyu
body:
  - type: input
    id: page
    attributes:
      label: 発生ページ / URL
      placeholder: "例: https://example.com/works"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      placeholder: "本来こうなるはず、という挙動を書いてください"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      placeholder: "実際に起きていることを書いてください"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 〇〇ページを開く
        2. 〇〇をクリック
        3. エラーが発生する
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: ブラウザ
      multiple: true
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - その他
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: スクリーンショット・補足
      description: 画像や追加情報があれば貼り付けてください（任意）
